<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JABCodeJS Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .text {
            margin: 20px 0;
        }
        img {
            border: 1px solid #ccc;
            padding: 10px;
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>JABCodeJS Test</h1>
    <p>Encoding "Hello, world!" into a JABCode:</p>
    <div class="text"></div>
    
    <script type="module">
        import JabcodeJSInterface from './dist/jabcodeJSLib.min.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            try {
                const jabcode = new JabcodeJSInterface();
                const data = jabcode.encode_message('Hello, world!');
                const text = document.querySelector('.text');
                const img = new Image();
                img.src = data;
                img.alt = 'JABCode encoded image';
                text.appendChild(img);
            } catch (error) {
                console.error('Error:', error);
                document.querySelector('.text').textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
